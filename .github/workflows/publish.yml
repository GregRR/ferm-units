name: Publish release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  resolve:
    name: Resolve release commit
    runs-on: ubuntu-latest
    outputs:
      commit_sha: ${{ steps.release.outputs.commit_sha }}

    steps:
      - name: Check out release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Verify release context
        id: release
        shell: bash
        run: |
          commit="$(git rev-parse HEAD)"
          if [[ "$commit" != "${{ github.sha }}" ]]; then
            echo "Checked-out commit $commit does not match release event SHA ${{ github.sha }}" >&2
            exit 1
          fi

          tag="${{ github.event.release.tag_name }}"
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml | head -1)"
          expected="v${version}"
          if [[ "$tag" != "$expected" ]]; then
            echo "Release tag $tag does not match package version $expected" >&2
            exit 1
          fi

          echo "commit_sha=$commit" >> "$GITHUB_OUTPUT"

  test:
    needs: resolve
    name: Verify Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out resolved release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.10"
          python-version: ${{ matrix.python-version }}

      - name: Sync locked environment
        run: uv sync --locked --dev

      - name: Run tests
        run: uv run --locked pytest

  quality:
    name: Verify quality gates
    needs: resolve
    runs-on: ubuntu-latest

    steps:
      - name: Check out resolved release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.10"
          python-version: "3.11"

      - name: Verify lockfile
        run: uv lock --check

      - name: Sync locked environment
        run: uv sync --locked --dev

      - name: Run Ruff
        run: uv run --locked ruff check .

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Run mypy
        run: uv run --locked mypy src tests/typecheck

  build:
    name: Build release artifacts
    needs: [resolve, test, quality]
    runs-on: ubuntu-latest

    steps:
      - name: Check out resolved release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.resolve.outputs.commit_sha }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          version: "0.12.10"
          python-version: "3.11"

      - name: Build distributions
        run: uv build --no-sources

      - name: Validate distributions
        run: uvx --from twine==7.0.0 twine check dist/*

      - name: Inspect distribution contents
        run: |
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          dist = Path("dist")
          wheels = sorted(dist.glob("*.whl"))
          sdists = sorted(dist.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(
                  f"expected one wheel and one sdist, found {wheels=} {sdists=}"
              )

          required_wheel = {
              "fermunits/py.typed",
              "fermunits/definitions/solution_chemistry.txt",
              "fermunits/definitions/vessels.txt",
          }
          with zipfile.ZipFile(wheels[0]) as archive:
              names = set(archive.namelist())
          missing = required_wheel - names
          if missing:
              raise SystemExit(f"wheel is missing runtime resources: {sorted(missing)}")
          if not any(name.endswith(".dist-info/licenses/LICENSE") for name in names):
              raise SystemExit("wheel is missing LICENSE metadata")

          required_sdist_suffixes = {
              "/LICENSE",
              "/pyproject.toml",
              "/src/fermunits/py.typed",
              "/src/fermunits/definitions/solution_chemistry.txt",
              "/src/fermunits/definitions/vessels.txt",
          }
          with tarfile.open(sdists[0], "r:gz") as archive:
              names = set(archive.getnames())
          for suffix in required_sdist_suffixes:
              if not any(name.endswith(suffix) for name in names):
                  raise SystemExit(f"sdist is missing required file ending in {suffix}")
          PY

      - name: Smoke-test built wheel
        shell: bash
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml | head -1)"
          FERMUNITS_EXPECTED_VERSION="$version" \
            uv run --isolated --no-project --with "$wheel" -- python - <<'PY'
          import os
          from importlib.metadata import distribution
          from importlib.resources import files

          from fermunits import PHValue, Q_, UnitRegistry, __version__, create_registry

          assert __version__ == os.environ["FERMUNITS_EXPECTED_VERSION"]
          assert Q_(1, "firkin").to("imperial_gallon").magnitude == 9
          assert Q_(1, "milliequivalent").to("equivalent").magnitude == 0.001
          assert PHValue(7.0).value == 7.0
          assert isinstance(create_registry(), UnitRegistry)
          assert files("fermunits").joinpath("py.typed").is_file()
          assert files("fermunits.definitions").joinpath("vessels.txt").is_file()
          metadata_files = distribution("ferm-units").files or []
          assert any(
              str(path).endswith(".dist-info/licenses/LICENSE")
              for path in metadata_files
          )
          PY

      - name: Smoke-test source distribution
        shell: bash
        run: |
          sdist="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml | head -1)"
          FERMUNITS_EXPECTED_VERSION="$version" \
            uv run --isolated --no-project --with "$sdist" -- python - <<'PY'
          import os
          from importlib.metadata import distribution
          from importlib.resources import files

          from fermunits import PHValue, Q_, UnitRegistry, __version__, create_registry

          assert __version__ == os.environ["FERMUNITS_EXPECTED_VERSION"]
          assert Q_(1, "brewing_hogshead").to("imperial_gallon").magnitude == 54
          assert Q_(1, "milliequivalent").to("equivalent").magnitude == 0.001
          assert PHValue(7.0).value == 7.0
          assert isinstance(create_registry(), UnitRegistry)
          assert files("fermunits").joinpath("py.typed").is_file()
          assert files("fermunits.definitions").joinpath("vessels.txt").is_file()
          metadata_files = distribution("ferm-units").files or []
          assert any(
              str(path).endswith(".dist-info/licenses/LICENSE")
              for path in metadata_files
          )
          PY

      - name: Preserve distributions for release jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release_assets:
    name: Attach distributions to GitHub release
    needs: [resolve, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Attach distributions to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/* --clobber

  publish:
    name: Publish to PyPI
    needs: release_assets
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ferm-units/
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
